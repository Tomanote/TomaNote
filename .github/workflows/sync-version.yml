name: Sync Version Across Ecosystem

on:
  release:
    types: [published]
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  sync-version:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      # The `secrets` context is not available in job-level `if:` conditions,
      # so token presence is checked here and exposed as a step output that
      # the sync steps below gate on. Without this guard the job crashes with
      # "Input required and not supplied: token" on every tag push.
      - name: Check for SYNC_TOKEN
        id: token_check
        env:
          SYNC_TOKEN: ${{ secrets.SYNC_TOKEN }}
        run: |
          if [ -z "$SYNC_TOKEN" ]; then
            echo "has_token=false" >> "$GITHUB_OUTPUT"
            echo "⚠️ SYNC_TOKEN secret is not configured — skipping ecosystem version sync."
            echo "Configure a PAT with access to Tomanote/TomaNote-Docs and Tomanote/TomaNote-blog as the SYNC_TOKEN repository secret to enable this workflow."
          else
            echo "has_token=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Extract version from tag
        id: get_version
        run: |
          VERSION="${GITHUB_REF#refs/tags/}"
          # Strip leading 'v' if present (v0.5.7 → 0.5.7)
          VERSION="${VERSION#v}"
          echo "VERSION=${VERSION}" >> $GITHUB_OUTPUT
          echo "📦 Syncing version: ${VERSION}"

      # ─────────────────────────────────────────────────────────
      # SYNC: TomaNote-Docs
      # ─────────────────────────────────────────────────────────
      - name: Clone TomaNote-Docs
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: "Tomanote/TomaNote-Docs"
          token: ${{ secrets.SYNC_TOKEN }}
          path: docs-repo

      - name: Update version in Docs
        if: steps.token_check.outputs.has_token == 'true'
        working-directory: docs-repo
        run: |
          # Update package.json version
          if [ -f package.json ]; then
            sed -i "s/\"version\": \".*\"/\"version\": \"${{ steps.get_version.outputs.VERSION }}\"/g" package.json
            echo "✅ Updated docs/package.json → ${{ steps.get_version.outputs.VERSION }}"
          else
            echo "⚠️ docs/package.json not found — skipping"
          fi

          # Also update version.json if it exists
          if [ -f src/content/docs/version.json ]; then
            echo "{\"current\": \"${{ steps.get_version.outputs.VERSION }}\"}" > src/content/docs/version.json
            echo "✅ Updated docs/version.json → ${{ steps.get_version.outputs.VERSION }}"
          fi

      - name: Push to TomaNote-Docs
        if: steps.token_check.outputs.has_token == 'true'
        working-directory: docs-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "ℹ️ No version changes in Docs — skipping commit"
          else
            git commit -m "chore: sync version to ${{ steps.get_version.outputs.VERSION }}"
            git push origin HEAD:master
            echo "✅ Pushed Docs update"
          fi

      # ─────────────────────────────────────────────────────────
      # SYNC: TomaNote-blog
      # ─────────────────────────────────────────────────────────
      - name: Clone TomaNote-blog
        if: steps.token_check.outputs.has_token == 'true'
        uses: actions/checkout@v4
        with:
          repository: "Tomanote/TomaNote-blog"
          token: ${{ secrets.SYNC_TOKEN }}
          path: blog-repo

      - name: Update version in Blog
        if: steps.token_check.outputs.has_token == 'true'
        working-directory: blog-repo
        run: |
          echo "{\"app_version\": \"${{ steps.get_version.outputs.VERSION }}\"}" > version-info.json
          echo "✅ Updated blog/version-info.json → ${{ steps.get_version.outputs.VERSION }}"

      - name: Push to TomaNote-blog
        if: steps.token_check.outputs.has_token == 'true'
        working-directory: blog-repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add .
          if git diff --cached --quiet; then
            echo "ℹ️ No version changes in Blog — skipping commit"
          else
            git commit -m "chore: sync version badge to ${{ steps.get_version.outputs.VERSION }}"
            git push origin HEAD:master
            echo "✅ Pushed Blog update"
          fi

      # ─────────────────────────────────────────────────────────
      # Summary
      # ─────────────────────────────────────────────────────────
      - name: Sync summary
        if: always()
        env:
          HAS_TOKEN: ${{ steps.token_check.outputs.has_token }}
          JOB_STATUS: ${{ job.status }}
          VERSION: ${{ steps.get_version.outputs.VERSION }}
        run: |
          if [ "$HAS_TOKEN" != "true" ]; then
            STATUS="⏭ Skipped (SYNC_TOKEN not configured)"
          elif [ "$JOB_STATUS" == "success" ]; then
            STATUS="✅ Synced"
          else
            STATUS="❌ Failed"
          fi
          echo "## 🔗 Version Sync Summary" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "| Repository | Version | Status |" >> $GITHUB_STEP_SUMMARY
          echo "|------------|---------|--------|"
          echo "| TomaNote-Docs | \`${VERSION}\` | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
          echo "| TomaNote-blog | \`${VERSION}\` | ${STATUS} |" >> $GITHUB_STEP_SUMMARY
